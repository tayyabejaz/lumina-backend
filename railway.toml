# Railway config for the WEB service (builds from the Dockerfile in this folder).
# Create a SECOND Railway service for the worker in the same project, pointing at the same
# repo/folder, and override its start command to:
#   arq app.workers.worker.WorkerSettings
# (see Deployment.md). Both services share the same env vars / Redis / Supabase.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${WEB_CONCURRENCY:-2}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
