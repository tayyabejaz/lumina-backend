[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-prep-backend"
version = "0.1.0"
description = "FastAPI modular backend (SOLID, async, Supabase) for the Adaptive Exam-Prep Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "supabase>=2.5",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "sentry-sdk>=2.5",
]

# Managed by uv. `uv sync` installs the project + the dev group below and writes uv.lock.
[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# uv creates and manages .venv and the uv.lock lockfile (commit uv.lock to the repo).
# The "dev" dependency-group is installed by default; use `uv sync --no-dev` for prod.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
